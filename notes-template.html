<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="source-sha256" content="$source_sha256">
  <link rel="icon" href="data:,">
  <title>$title · Cyber SEA Game 2026</title>
  <style>
    :root { color-scheme:light; --ink:#18252b; --muted:#52636a; --line:#cbd7d3; --paper:#f7f8f4; --green:#086b58; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif; }
    .wrap { max-width:1000px; margin:auto; padding:0 22px; }
    header { background:#142e32; padding:16px 0; }
    header a { color:#e0eeea; font-weight:650; }
    a { color:var(--green); text-underline-offset:3px; }
    a:hover { text-decoration-thickness:2px; }
    :focus-visible { outline:3px solid #d88837; outline-offset:3px; }
    .skip { position:absolute; top:8px; left:12px; background:white; padding:8px; transform:translateY(-150%); }
    .skip:focus { transform:none; }
    main { padding-top:20px !important; padding-bottom:32px !important; overflow-wrap:anywhere; }
    h1 { margin:0 0 18px; font-size:clamp(1.65rem,4vw,2.4rem); line-height:1.15; letter-spacing:-.035em; }
    h2 { margin-top:30px; padding-top:8px; border-top:2px solid var(--ink); font-size:1.35rem; }
    h3 { font-size:1.1rem; }
    [id] { scroll-margin-top:16px; }
    code { font:.88em/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; }
    pre { max-width:100%; overflow-x:auto; padding:12px; background:#e8f2ed; }
    pre code { white-space:pre-wrap; overflow-wrap:anywhere; }
    .table-scroll { max-width:100%; overflow-x:auto; margin:16px 0; }
    table { width:100%; border-collapse:collapse; background:white; font-size:.9rem; }
    th, td { padding:9px 12px; border:1px solid var(--line); vertical-align:top; min-width:140px; }
    th { background:#e8f2ed; text-align:left; }
    details { margin:12px 0; padding:10px 14px; border:1px solid var(--line); border-radius:6px; background:white; }
    summary { cursor:pointer; font-weight:650; }
    img { max-width:100%; height:auto; }
    blockquote { margin-left:0; padding-left:16px; border-left:4px solid var(--green); }
    footer { padding:18px 0 28px; border-top:1px solid var(--line); color:var(--muted); font-size:.85rem; }
    @media (max-width:360px) { .wrap { padding-left:14px; padding-right:14px; } }
    @media print { header, .skip, footer { display:none; } .wrap { max-width:none; } .table-scroll { overflow:visible; } th, td { min-width:0; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to notes</a>
  <header><div class="wrap"><a href="$field_guide">← Field guide</a></div></header>
  <main id="main" class="wrap" tabindex="-1">$content</main>
  <footer><div class="wrap"><a href="$source">Markdown source</a></div></footer>
</body>
</html>
